name: Build and Publish RTP-Engine

on:
  push:
    branches:
      - kaya
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        arch: [amd64]
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: "noninteractive"

    container:
      image: debian:11

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        apt-get update && \
        apt-get install -y --no-install-recommends \
        build-essential \
        dpkg-dev \
        debhelper \
        default-libmysqlclient-dev \
        gperf \
        libxtables-dev \
        libip6tc-dev \
        libip4tc-dev \
        libavcodec-dev \
        libavfilter-dev \
        libavformat-dev \
        libavutil-dev \
        libbencode-perl \
        libcrypt-openssl-rsa-perl \
        libcrypt-rijndael-perl \
        libhiredis-dev \
        libio-multiplex-perl \
        libio-socket-inet6-perl \
        libjson-glib-dev \
        libdigest-crc-perl \
        libdigest-hmac-perl \
        libnet-interface-perl \
        libssl-dev \
        libsystemd-dev \
        libxmlrpc-core-c3-dev \
        libcurl4-openssl-dev \
        libevent-dev \
        libpcap0.8-dev \
        unzip \
        nfs-common \
        dkms \
        libspandsp-dev \
        libmosquitto-dev \
        python3-websockets \
        cmake \
        wget \
        libbcg729-0 \
        libbcg729-dev \
        libiptc-dev \
        libjson-perl \
        libmnl-dev \
        libncurses-dev \
        libnftnl-dev \
        libopus-dev \
        libtest2-suite-perl \
        liburing-dev \
        libwebsockets-dev \
        pandoc \
        pkgconf \
        systemd \
        discount \
        libswresample-dev \
        libpcre2-dev \
        libglib2.0-dev \
        libsocket6-perl \
        zlib1g-dev

    - name: Build Debian Package
      run: |
        dpkg-checkbuilddeps && \
        dpkg-buildpackage --no-sign -a${{ matrix.arch }}

    - name: Archive Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: rtpengine-packages-${{ matrix.arch }}
        path: ../*.deb
